<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="importmap">{"imports": {"axios": "https://cdn.jsdelivr.net/npm/axios@1.7.9/+esm"}}</script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" src="/FlowBoard/js/main.js"></script>
    <link rel="stylesheet" href="./style.css">


</head>

<body>
    <header class="w-full">
        <div class="flex justify-between items-center py-6 px-8">
            <span
                class="text-2xl font-black tracking-wider uppercase bg-gradient-to-r from-indigo-400 to-violet-500 bg-clip-text text-transparent">FlowBoard</span>
            <div id="butoncreat_reset_holder" class="flex flex-col gap-1 md:flex-row lg:flex-row justify-between ">
                <button id="addbtn" class="bg-purple-400 hover:bg-purple-500 py-2 px-3 rounded-sm text-purple-100 ">+
                    new
                    task</button>
                <button id="reset"
                    class="bg-purple-400 hover:bg-purple-500 py-2 px-3 rounded-sm text-purple-100 ">reset</button>
            </div>
        </div>


    </header>
    <main>
        <section class="flex flex-col justify-between md:flex-row lg:flex-row items-center">

            <label
                class="flex items-center gap-3 max-w-md mx-auto px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-lg cursor-text focus-within:bg-white focus-within:ring-2 focus-within:ring-blue-500 focus-within:border-blue-500 transition">
                <span class="text-sm font-medium text-gray-500 select-none">Search</span>
                <input type="search" id="searchbar" minlength="2" maxlength="50"
                    class="w-full text-sm text-gray-900 bg-transparent focus:outline-none placeholder:text-gray-400"
                    placeholder="Type here..." />
            </label>
            <form id="Filter_form" class=" px-4 pb-5 flex gap-4" onsubmit="return false">
                <label class="flex flex-col gap-1 text-sm text-black-500">
                    Priority
                    <select id="priority_filter" class="w-full text-black rounded border border-gray-300 px-3 py-2">
                        <option value="">All</option>
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>
                </label>

                <label class="flex flex-col gap-1 text-sm C">
                    Assignee
                    <select id="assignee_filter" class="w-full text-black rounded border border-gray-300 px-3 py-2">
                        <option value="">All</option>
                        <option value="Thomas Leroy">Thomas Leroy</option>
                        <option value="Inès Moreau">Inès Moreau</option>
                        <option value="Lucas Martin">Lucas Martin</option>
                        <option value="Amina Haddad">Amina Haddad</option>
                        <option value="Yasmine Benali">Yasmine Benali</option>
                    </select>
                </label>
            </form>
        </section>
        <section class=" flex px-10 hidden inset-0 z-50 w-screen h-screen bg-gray-800 ">
            <div id="search_display" class="w-full h-full bg-gray-700 flex flex-col pb-5 px-4   rounded-md">






            </div>
        </section>
        <section id="loading_section" class="hidden">
            <div class="loader"></div>
            <span class="loading">page loading ...</span>
        </section>
        <section id="errorsec" class="w-screen px-5 py-3 bg-gray-800 hidden ">
            <div class="flex justify-between text-red-800 items-center px-4 bg-red-200 w-full h-20  rounded-md">
                <button id="refreshbtn"
                    class="bg-red-400 hover:bg-red-700 py-2 px-3 rounded-sm text-purple-100 ">refresh</button>
            </div>
        </section>
        <section
            class="max-h-max min-h-screen w-full  grid grid-cols-1  md:grid-cols-2  lg:grid-cols-3 bg-white pt-6 shadow-md outline outline-black/5 dark:bg-gray-800 p-5 justify-stretch  gap-6 ">
            <div id="todo" class="min-w-[200px]  h-max bg-gray-700 rounded-sm p-5">
                <div id="col1"><span>TO DO</span><span id="todototal"></span></div>

                <div id="todo_holder">


                </div>
            </div>
            <div id="inprogress" class="min-w-[200px]  h-max bg-gray-700 rounded-sm p-5">
                <div id="col2"><span>In Progress</span>
                    <span id="progresstotal"></span>
                </div>

                <div id="inprogress_holder">


                </div>

            </div>
            <div id="col3" class="min-w-[200px]  h-max bg-gray-700 rounded-sm p-5">
                <div class="flex"><span>complated</span>
                    <span id="complatedtotal"></span>
                </div>

                <div id="done_holder">


                </div>
            </div>
        </section>
        <section id="wizard"
            class="fixed hidden flex flex-col px-10 py-20 justify-center items-center inset-0 z-50 w-screen h-screen backdrop-blur-sm">
            <button id="ai_btn" class="absolute top-21 left-14 p-4 border-purple-600 border-3 bg-purple-400 hover:bg-purple-500  rounded-sm text-purple-100 ">generate with ai</button>
            <div id="task_add" class="w-full h-full bg-sky-200 flex flex-col pb-5 px-4 rounded-md">
                <div class="flex justify-end "><button  class="out m-4 bg-red-500 hover:bg-red-700 py-2 px-3 rounded-sm text-purple-100 ">X</button></div>
                <form id="add_modif_form" action="" class="h-full flex flex-col gap-4 bg-white p-6">
                    <label class="flex flex-col gap-1 text-sm text-gray-700">
                        Title
                        <input type="text" id="title_add" name="title" placeholder="Task title" required
                            class="w-full rounded border border-gray-300 px-3 py-2">
                    </label>

                    <label class="flex flex-col gap-1 text-sm text-gray-700">
                        Description
                        <textarea id="description_add" name="description" rows="4" placeholder="Describe the task..."
                            class="w-full rounded border border-gray-300 px-3 py-2"></textarea>
                    </label>

                    <div class="grid grid-cols-2 gap-4">
                        <label class="flex flex-col gap-1 text-sm text-gray-700">
                            Priority
                            <select id="priority_add" name="priority"
                                class="w-full rounded border border-gray-300 px-3 py-2">
                                <option value="high">High</option>
                                <option value="medium" selected>Medium</option>
                                <option value="low">Low</option>
                            </select>
                        </label>

                        <label class="flex flex-col gap-1 text-sm text-gray-700">
                            Assignee
                            <select id="assignee_add" name="assignee"
                                class="w-full rounded border border-gray-300 px-3 py-2">
                                <option value="Thomas Leroy">Thomas Leroy</option>
                                <option value="Inès Moreau">Inès Moreau</option>
                                <option value="Lucas Martin">Lucas Martin</option>
                                <option value="Amina Haddad">Amina Haddad</option>
                                <option value="Yasmine Benali">Yasmine Benali</option>
                                <option value="Amina Haddad">Amina Haddad</option>

                            </select>
                        </label>
                    </div>

                    <button value="add" class="mt-auto  w-full rounded bg-gray-800 py-2 text-white">Save</button>
                    <button value="modif"
                        class="mt-auto hidden w-full rounded bg-gray-800 py-2 text-white">modifier</button>
                </form>

            </div>
            <div id="ai_task" class=" hidden w-full h-full bg-sky-200 flex flex-col pb-5 px-4 rounded-md">
                <div class="flex justify-end "><button class="out m-4 bg-red-500 hover:bg-red-700 py-2 px-3 rounded-sm text-purple-100 ">X</button></div>
                <form id="add_ai_form" action="" class="h-full flex flex-col gap-4 bg-white p-6">
                    

                    <label class="flex flex-col gap-1 text-sm text-gray-700">
                        Description
                        <textarea id="description_ai" name="description" rows="4" placeholder="Describe the task..."
                            class="w-full rounded border border-gray-300 px-3 py-2" min-length:  10 max-length:2000 required></textarea>
                    </label>

                    <label class="flex flex-col gap-1c h-10 text-sm text-gray-700" >
                        <input  class="w-full rounded border border-gray-300 px-3 py-2" type="number" name="ai_counter" id="ai_counter" min="1" max="10">
                    </label>

                    
                    <button value="ai_generat" class="mt-auto  w-full rounded bg-gray-800 py-2 text-white">generat</button>
                    
                </form>

            </div>
        </section>

    </main>

</body>

</html>
