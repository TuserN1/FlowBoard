<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" src="./dynamics/data.js"></script>
    <link rel="stylesheet" href="./style/style.css">


</head>

<body>
    <header class="w-full">
        <div class="flex justify-between items-center py-6 px-8">
            <span
                class="text-2xl font-black tracking-wider uppercase bg-gradient-to-r from-indigo-600 to-violet-500 bg-clip-text text-transparent">FlowBoard</span>
            <button id="addbtn" class="bg-purple-500 hover:bg-purple-700 py-2 px-3 rounded-sm text-purple-100 ">+ new
                task</button>
        </div>


    </header>
    <main>
        <section class="flex justify-between items-center">
            
            <label
            class="flex items-center gap-3 max-w-md mx-auto px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-lg cursor-text focus-within:bg-white focus-within:ring-2 focus-within:ring-blue-500 focus-within:border-blue-500 transition">
            <span class="text-sm font-medium text-gray-500 select-none">Search</span>
            <input type="search" id="searchbar" minlength="2" maxlength="50"
            class="w-full text-sm text-gray-900 bg-transparent focus:outline-none placeholder:text-gray-400"
            placeholder="Type here..." />
        </label>
        <button class="flex m-6 py-2 px-4 bg-sky-300 rounded-md">Filter</button>
    </section>
    <section 
        class=" flex px-10 hidden inset-0 z-50 w-screen h-screen bg-gray-800 ">
        <div id="search_display" class="w-full h-full bg-gray-700 flex flex-col pb-5 px-4   rounded-md">
            
                

               

        </div>
    </section>
    <section 
        class=" flex px-10 hidden inset-0 z-50 w-screen h-screen bg-gray-800 ">
        <div id="Filter_display" class="w-full h-full bg-gray-700 flex flex-col pb-5 px-4   rounded-md">
            
                

               

        </div>
    </section>
        <section id="errorsec" class="w-screen px-5 py-3 bg-gray-800 hidden">
            <div class="flex justify-end items-center px-4 bg-red-200 w-full h-20  rounded-md">
                <button id="refreshbtn"
                    class="bg-red-400 hover:bg-red-700 py-2 px-3 rounded-sm text-purple-100 ">refresh</button>
            </div>
        </section>
        <section
            class="max-h-max min-h-screen w-full  grid grid-cols-[auto_auto_auto]  bg-white pt-6 flex-row shadow-md outline outline-black/5 dark:bg-gray-800 p-5 <div grid-cols-[repeat(auto-fit,minmax(max(250px,calc((100%-3rem)/3)),1fr))] justify-stretch  gap-6 ">
            <div id="todo" class="min-w-[200px]  h-max bg-gray-700 rounded-sm p-5">
                <div id="col1"><span>TO DO</span><span id="todototal"></span></div>

                <div id="todo_holder">


                </div>
            </div>
            <div id="inprogress" class="min-w-[200px]  h-max bg-gray-700 rounded-sm p-5">
                <div id="col2"><span>In Progress</span>
                    <span id="progresstotal"></span>
                </div>

                <div id="inprogress_holder">


                </div>

            </div>
            <div id="col3" class="min-w-[200px]  h-max bg-gray-700 rounded-sm p-5">
                <div class="flex"><span>complated</span>
                    <span id="complatedtotal"></span>
                </div>

                <div id="done_holder">


                </div>
            </div>
        </section>
        <section id="wizard"
            class="fixed hidden flex px-10 py-20 justify-center items-center inset-0 z-50 w-screen h-screen backdrop-blur-sm">
            <div class="w-full h-full bg-sky-200 flex flex-col pb-5 px-4 rounded-md">
                <div class="flex justify-end "><button id="out"
                        class="m-4 bg-red-500 hover:bg-red-700 py-2 px-3 rounded-sm text-purple-100 ">X</button></div>
                <form id="add_task_form" action="" class="h-full flex flex-col gap-4 bg-white p-6">
                    <label class="flex flex-col gap-1 text-sm text-gray-700">
                        Title
                        <input type="text" id="title_add" placeholder="Task title" required
                            class="w-full rounded border border-gray-300 px-3 py-2">
                    </label>

                    <label class="flex flex-col gap-1 text-sm text-gray-700">
                        Description
                        <textarea id="description_add" rows="4" placeholder="Describe the task..."
                            class="w-full rounded border border-gray-300 px-3 py-2"></textarea>
                    </label>

                    <div class="grid grid-cols-2 gap-4">
                        <label class="flex flex-col gap-1 text-sm text-gray-700">
                            Priority
                            <select id="priority_add" class="w-full rounded border border-gray-300 px-3 py-2">
                                <option value="high">High</option>
                                <option value="medium" selected>Medium</option>
                                <option value="low">Low</option>
                            </select>
                        </label>

                        <label class="flex flex-col gap-1 text-sm text-gray-700">
                            Assignee
                            <select id="assignee_add" class="w-full rounded border border-gray-300 px-3 py-2">
                                <option value="Thomas Leroy">Thomas Leroy</option>
                                <option value="Inès Moreau">Inès Moreau</option>
                                <option value="Lucas Martin">Lucas Martin</option>
                                <option value="Amina Haddad">Amina Haddad</option>
                                <option value="Yasmine Benali">Yasmine Benali</option>
                                <option value="Amina Haddad">Amina Haddad</option>

                            </select>
                        </label>
                    </div>
                    
                    <button  class="mt-auto w-full rounded bg-gray-800 py-2 text-white">Save</button>
                </form>

            </div>
        </section>
        
    </main>

</body>

</html>
